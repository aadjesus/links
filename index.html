<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Links</title>

    <style>
        :root {
            --bg: #f5f5f5;
            --card-bg: #ffffff;
            --border: #dcdcdc;
            --border-hover: #b5b5b5;
            --text: #222;
            --text-secondary: #555;
            --radius: 10px;
            --size: 110px; /* tamanho dos cards */
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 26px;
        }

        .profile {
            text-align: center;
            margin-bottom: 24px;
        }

        .avatar {
            width: 95px;
            height: 95px;
            border-radius: 50%;
            border: 2px solid var(--border);
            object-fit: cover;
            margin-bottom: 10px;
            background: #eee;
        }

        h1 {
            margin: 0;
            font-size: 1.4rem;
            font-weight: 600;
        }

        .subtitle {
            margin-top: 4px;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            width: 100%;
            max-width: 500px;
        }

        @media (max-width: 600px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 380px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            min-height: var(--size);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-decoration: none;
            color: var(--text);
            transition: 0.2s ease;
            position: relative;
            cursor: pointer;
        }

            .card:hover {
                border-color: var(--border-hover);
                background: #fafafa;
            }

        .icon {
            font-size: 1.4rem;
        }

        .label {
            font-size: 0.95rem;
            font-weight: 500;
        }

        /* Tooltip simples */
        .card:hover::after {
            content: attr(data-tip);
            position: absolute;
            bottom: -32px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: #fff;
            padding: 6px 8px;
            font-size: 0.75rem;
            border-radius: 6px;
            white-space: nowrap;
            opacity: 1;
            pointer-events: none;
        }

        .card::after {
            opacity: 0;
            transition: 0.15s ease;
        }
    </style>
</head>
<body>

    <div class="profile">
        <img src="assets/avatar.jpg" alt="Avatar" class="avatar">
        <h1>Meus Links</h1>
        <div class="subtitle">Acesso rápido</div>
    </div>

    <div class="grid" id="grid"></div>

    <script>
    function normalizarUrl(url) {
      if (!url) return "#";
      if (url.startsWith("http") || url.startsWith("mailto:")) return url;
      return `https://${url}`;
    }

    async function carregarLinks() {
      const grid = document.getElementById("grid");
      try {
        const res = await fetch("links.json");
        const links = await res.json();

        links.forEach(link => {
          const a = document.createElement("a");
          a.href = normalizarUrl(link.url);
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          a.className = "card";
          a.setAttribute("data-tip", link.descricao ?? link.url);
          a.innerHTML = `
            <div class="icon">${link.icone ?? "🔗"}</div>
            <div class="label">${link.nome}</div>
          `;
          grid.appendChild(a);
        });
      } catch (e) {
        console.error("Erro ao carregar links.json", e);
      }
    }

    carregarLinks();
    </script>

</body>
</html>
