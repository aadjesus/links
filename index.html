<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Links</title>

    <style>
        :root {
            --bg: #0f0f10;
            --card-bg: #1a1a1c;
            --border: #262629;
            --border-hover: #3a3a3d;
            --text: #f5f5f5;
            --text-secondary: #9b9b9b;
            --radius: 8px;
            --size: 54px;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px;
        }

        .profile {
            text-align: center;
            margin-bottom: 20px;
        }

        .avatar {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            border: 2px solid var(--border);
            object-fit: cover;
            margin-bottom: 8px;
            background: #222;
        }

        h1 {
            margin: 0;
            font-size: 1.2rem;
            font-weight: 600;
        }

        .subtitle {
            margin-top: 3px;
            font-size: 0.82rem;
            color: var(--text-secondary);
        }

        /* Accordion */
        .accordion {
            width: 100%;
            max-width: 480px;
            margin-bottom: 10px;
        }

        .accordion-header {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            padding: 10px 12px;
            font-size: 0.95rem;
            font-weight: 600;
            background: #1c1c1e;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            transition: 0.2s ease;
        }

            .accordion-header:hover {
                border-color: var(--border-hover);
                background: #232326;
            }

            .accordion-header .indicador {
                transition: transform 0.2s ease;
                opacity: 0.8;
            }

        .accordion.open .indicador {
            transform: rotate(90deg);
            opacity: 1;
        }

        .accordion-content {
            padding: 10px 0 4px;
            display: none;
        }

        .accordion.open .accordion-content {
            display: block;
        }

        /* Grid de links dentro do accordion */
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            width: 100%;
            padding: 0 6px;
        }

        @media (max-width: 600px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 380px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        /* Cards */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            min-height: var(--size);
            display: flex;
            align-items: center;
            padding: 6px 10px;
            text-decoration: none;
            color: var(--text);
            transition: 0.16s ease;
            position: relative;
            cursor: pointer;
            font-size: 0.9rem;
            gap: 8px;
        }

            .card:hover {
                border-color: var(--border-hover);
                background: #222225;
            }

        .icon {
            font-size: 1.1rem;
            width: 20px;
            text-align: center;
            flex-shrink: 0;
        }

        .label {
            font-size: 0.88rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Tooltip */
        .card::after {
            content: attr(data-tip);
            position: absolute;
            bottom: -32px;
            left: 50%;
            transform: translateX(-50%);
            background: #000;
            color: #fff;
            padding: 5px 7px;
            font-size: 0.72rem;
            border-radius: 5px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.12s ease;
            z-index: 5;
        }

        .card:hover::after {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="profile">
        <img src="assets/avatar.jpg" alt="Avatar" class="avatar">
        <h1>Meus Links</h1>
        <div class="subtitle">Organizados por grupo</div>
    </div>

    <div id="container"></div>

    <script>
        function normalizarUrl(url) {
            if (!url) return "#";
            if (url.startsWith("http") || url.startsWith("mailto:")) return url;
            return `https://${url}`;
        }

        function salvarEstado(nome, aberto) {
            const estados = JSON.parse(localStorage.getItem("estadosAccordion") || "{}");
            estados[nome] = aberto;
            localStorage.setItem("estadosAccordion", JSON.stringify(estados));
        }

        function obterEstado(nome, padrao) {
            const estados = JSON.parse(localStorage.getItem("estadosAccordion") || "{}");
            return estados[nome] !== undefined ? estados[nome] : padrao;
        }

        async function carregarLinks() {
            const container = document.getElementById("container");
            try {
                const res = await fetch("links.json");
                const grupos = await res.json();

                grupos.forEach(grupo => {
                    const abertoInicial = obterEstado(grupo.nome, grupo.aberto);

                    const accordion = document.createElement("div");
                    accordion.className = "accordion" + (abertoInicial ? " open" : "");

                    const header = document.createElement("div");
                    header.className = "accordion-header";
                    header.style.color = grupo.cor || "var(--text)";
                    header.innerHTML = `
                <span class="indicador">▶</span>
                <span>${grupo.icone ?? "📁"}</span>
                <span>${grupo.nome}</span>
              `;

                    header.addEventListener("click", () => {
                        accordion.classList.toggle("open");
                        const estaAberto = accordion.classList.contains("open");
                        salvarEstado(grupo.nome, estaAberto);
                    });

                    const content = document.createElement("div");
                    content.className = "accordion-content";
                    const grid = document.createElement("div");
                    grid.className = "grid";

                    grupo.links.forEach(link => {
                        const a = document.createElement("a");
                        a.href = normalizarUrl(link.url);
                        a.target = "_blank";
                        a.rel = "noopener noreferrer";
                        a.className = "card";
                        const tooltip = link.descricao ? link.descricao : link.url;
                        a.setAttribute("data-tip", tooltip);
                        a.innerHTML = `
                  <div class="icon">${link.icone ?? "🔗"}</div>
                  <div class="label">${link.nome}</div>
                `;
                        grid.appendChild(a);
                    });

                    content.appendChild(grid);
                    accordion.appendChild(header);
                    accordion.appendChild(content);
                    container.appendChild(accordion);
                });
            } catch (e) {
                console.error("Erro ao carregar links.json", e);
            }
        }

        carregarLinks();
    </script>

</body>
</html>
