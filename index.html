<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LinkList - Dark</title>

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: #0d0d0d;
            color: #e5e5e5;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 25px;
        }

        .profile-container {
            text-align: center;
            margin-bottom: 28px;
        }

        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 2px solid #333;
            background: #222;
            margin-bottom: 12px;
            object-fit: cover;
        }

        h1 {
            margin: 8px 0;
            font-size: 1.7rem;
            color: #fff;
        }

        p {
            color: #a1a1a1;
            margin: 0;
        }

        .links-container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-item {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: #1a1a1a;
            padding: 15px;
            border-radius: 10px;
            font-size: 1.15rem;
            cursor: pointer;
            text-decoration: none;
            color: #fff;
            transition: 0.22s;
            border: 1px solid #222;
        }

            .link-item:hover {
                background: #262626;
                border-color: #444;
                transform: scale(1.03);
            }

        .icon {
            font-size: 1.3rem;
        }
    </style>
</head>
<body>

    <div class="profile-container">
        <img src="assets/avatar.jpg" class="avatar" alt="Avatar" />
        <h1>Meus Links</h1>
        <p>Navegue por aí 👇</p>
    </div>

    <div class="links-container" id="links"></div>

    <script>
        async function carregarLinks() {
            try {
                const response = await fetch("links.json");
                const links = await response.json();
                const container = document.getElementById("links");

                links.forEach(link => {
                    const a = document.createElement("a");
                    a.className = "link-item";
                    a.href = link.url.startsWith("http") ? link.url : `https://${link.url}`;
                    a.target = "_blank";
                    a.innerHTML = `<span class="icon">${link.icone || "🔗"}</span> ${link.nome}`;
                    container.appendChild(a);
                });
            } catch (err) {
                console.error("Erro ao carregar links.json:", err);
            }
        }

        carregarLinks();
    </script>

</body>
</html>
